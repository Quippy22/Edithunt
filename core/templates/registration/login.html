{% extends 'theme/base.html' %}

{% block content %}
<div class="min-h-screen bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-200 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <h2 class="text-3xl font-bold text-center mb-6">Log In</h2>
        <form method="post" class="bg-white dark:bg-gray-800 shadow-lg rounded-lg px-8 pt-6 pb-8 mb-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-400 text-sm font-bold mb-2" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    <input 
                        type="{{ field.field.widget.input_type }}" 
                        name="{{ field.name }}" 
                        id="{{ field.id_for_label }}"
                        class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-50 dark:bg-gray-700 border-gray-300 dark:border-gray-600 text-gray-900 dark:text-gray-200 leading-tight focus:outline-none focus:border-purple-500 dark:focus:border-purple-400"
                    >
                    {% if field.help_text %}
                        <p class="text-gray-600 dark:text-gray-500 text-xs italic mt-2">{{ field.help_text }}</p>
                    {% endif %}
                    {% for error in field.errors %}
                        <p class="text-red-500 text-xs italic mt-2">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="flex items-center justify-between mt-6">
                <button type="submit" class="w-full btn-primary focus:outline-none">
                    Log In
                </button>
            </div>
            <p class="text-center text-gray-500 dark:text-gray-400 text-sm mt-6">
                Don't have an account? <a href="{% url 'signup' %}" class="text-purple-600 hover:text-purple-700 dark:text-purple-400 dark:hover:text-purple-300">Sign Up</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
