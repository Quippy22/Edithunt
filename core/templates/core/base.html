<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edithunt</title>
        {% block head %}{% endblock %}
        <!-- This script handles the dark mode theme switching.
         It checks the user's preference from localStorage or their system settings
         and applies the 'dark' class to the HTML element accordingly.
         It's placed in the head to prevent a "flash of unstyled content" (FOUC). -->
        <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        </script>
    </head>
    <body class="bg-gray-100 dark:bg-gray-900 flex flex-col min-h-screen font-sans antialiased w-full">
        {% include 'partials/navbar.html' %}
        <main class="flex-grow w-full">
            {% block content %}{% endblock %}
        </main>
        {% include 'partials/footer.html' %}
        <!-- Alpine.js for dropdowns and other interactive components -->
        <script defer
                src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- Include the main JavaScript file for the theme -->
        <script src="{% static 'js/theme.js' %}" defer></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
